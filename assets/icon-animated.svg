<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <style>
    .ln {
      transform-box: fill-box;
      transform-origin: center;
      transform: scaleX(0);
      animation: draw 2.6s cubic-bezier(0.3, 0.7, 0.2, 1) infinite;
      animation-delay: calc(var(--i) * 0.16s);
    }
    @keyframes draw {
      0%, 6% { transform: scaleX(0); opacity: 1; }
      32%, 84% { transform: scaleX(1); opacity: 1; }
      96%, 100% { transform: scaleX(1); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ln { animation: none; transform: none; }
    }
  </style>
  <rect width="128" height="128" rx="28" fill="#6D5EF5"/>

  <rect x="30" y="26" width="52" height="68" rx="8" fill="#ffffff" opacity="0.35" transform="rotate(-8 56 60)"/>
  <rect x="38" y="22" width="52" height="68" rx="8" fill="#ffffff" opacity="0.6" transform="rotate(-3 64 56)"/>
  <rect x="46" y="24" width="52" height="72" rx="8" fill="#ffffff"/>

  <g stroke-linecap="round">
    <line class="ln" style="--i:0" x1="56" y1="42" x2="82" y2="42" stroke="#6D5EF5" stroke-width="6"/>
    <line class="ln" style="--i:1" x1="56" y1="56" x2="88" y2="56" stroke="#C6C8E6" stroke-width="4"/>
    <line class="ln" style="--i:2" x1="56" y1="66" x2="80" y2="66" stroke="#C6C8E6" stroke-width="4"/>
    <line class="ln" style="--i:3" x1="56" y1="76" x2="88" y2="76" stroke="#6D5EF5" stroke-width="4"/>
    <line class="ln" style="--i:4" x1="56" y1="86" x2="74" y2="86" stroke="#C6C8E6" stroke-width="4"/>
  </g>
</svg>
