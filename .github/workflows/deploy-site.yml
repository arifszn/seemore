name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'packages/site/**'
      - 'packages/seemore/src/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter seemore build

      # pnpm links a workspace package's `bin` into its dependents' node_modules/.bin only
      # at install time, and only if the target file already exists then. `seemore`'s dist
      # doesn't exist until the build above, so the first install above left `site`'s
      # `seemore` bin unlinked (a warning, not a failure) — reinstalling now, with dist/
      # in place, relinks it.
      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter site build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
