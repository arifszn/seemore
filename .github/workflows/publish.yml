name: Publish

on:
  push:
    tags: ['seemore-v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance.
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      - name: Check the tag matches the version in packages/seemore/package.json
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#seemore-v}"
          version="$(node -p "require('./packages/seemore/package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match packages/seemore/package.json version $version." >&2
            exit 1
          fi

      # pnpm publish omits the readme field from the publish payload, which makes
      # npmjs.com show "This package does not have a README" — so publish with npm,
      # which attaches the packaged README.md to the registry metadata. prepack still
      # copies the root README.md/LICENSE in before the tarball is built.
      - name: Publish to npm
        working-directory: packages/seemore
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
