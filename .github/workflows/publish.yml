name: Publish

on:
  push:
    tags: ['seemore-v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance.
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm >= 11.5.1; node 22 bundles npm 10.x.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      - name: Check the tag matches the version in packages/seemore/package.json
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#seemore-v}"
          version="$(node -p "require('./packages/seemore/package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match packages/seemore/package.json version $version." >&2
            exit 1
          fi

      # No NODE_AUTH_TOKEN: npm falls back to OIDC trusted publishing via id-token: write.
      - run: pnpm --filter seemore publish --provenance --access public --no-git-checks
