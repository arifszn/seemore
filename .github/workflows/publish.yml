name: Publish

on:
  push:
    tags: ['seemore-v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance.
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      - name: Check the tag matches the version in packages/seemore/package.json
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#seemore-v}"
          version="$(node -p "require('./packages/seemore/package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match packages/seemore/package.json version $version." >&2
            exit 1
          fi

      # Publish clients read the package README before lifecycle scripts run, and
      # packages/seemore/README.md is a gitignored copy (the prepack copy lands too late
      # for the readme metadata). Copy it in first so the registry payload carries the
      # readme and npmjs.com renders it.
      - name: Copy the root README/LICENSE into the package
        working-directory: packages/seemore
        run: cp ../../README.md ../../LICENSE .

      - run: pnpm --filter seemore publish --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
