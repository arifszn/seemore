name: Publish extension

on:
  push:
    tags: ['vscode-v*']

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter seemore-vscode lint

      - run: pnpm --filter seemore-vscode typecheck

      - run: pnpm --filter seemore-vscode test

      - name: Check the tag matches the version in packages/vscode/package.json
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#vscode-v}"
          version="$(node -p "require('./packages/vscode/package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match packages/vscode/package.json version $version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package:
    needs: verify
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # seemore bundles vite, which bundles rolldown, which ships its bundler as a
          # platform-native addon (no pure-JS fallback). `scripts/package.mjs` does a real
          # `npm install` of seemore's dependency tree into the VSIX, so whatever platform
          # that install runs on is the only platform the resulting VSIX works on — there's
          # no way to cross-install a different OS/arch's native binding from here. Each
          # target below is therefore built on a runner that actually is that platform, and
          # `vsce package --target` tags the VSIX so the Marketplace serves the right one to
          # each user automatically.
          - target: darwin-arm64
            os: macos-latest
          - target: darwin-x64
            os: macos-15-intel
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: win32-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Produces packages/vscode/seemore-vscode-<target>-<version>.vsix — see scripts/package.mjs
      # for why this can't just be `vsce package` run in place (workspace symlinks, pnpm-managed
      # node_modules vsce won't accept).
      - run: pnpm --filter seemore-vscode run package --target ${{ matrix.target }}

      - name: Publish to the Visual Studio Marketplace
        working-directory: packages/vscode
        shell: bash
        run: |
          vsix="seemore-vscode-${{ matrix.target }}-${{ needs.verify.outputs.version }}.vsix"
          # A target-specific VSIX already carries its target in the manifest — vsce publish
          # refuses --target and --packagePath together ("Both options not supported
          # simultaneously"), so --packagePath alone is enough here.
          npx vsce publish --packagePath "$vsix" -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        working-directory: packages/vscode
        shell: bash
        run: |
          vsix="seemore-vscode-${{ matrix.target }}-${{ needs.verify.outputs.version }}.vsix"
          npx ovsx publish "$vsix" -p "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
