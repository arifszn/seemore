packages:
  - 'packages/*'

allowBuilds:
  esbuild: true
  # Its prebuilds cover every target and load at runtime; the scripts would only check
  # for them or fall back to node-gyp.
  node-pty: false

# Security floors for transitive deps (pnpm audit, Oct 2026).
overrides:
  dompurify: '>=3.4.16'
  esbuild: '>=0.28.1 <0.29.0'
  source-map-js: '>=1.2.2'
