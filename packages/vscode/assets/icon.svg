  <rect x="38" y="22" width="52" height="68" rx="8" fill="#ffffff" opacity="0.6" transform="rotate(-3 64 56)"/>
  <rect x="46" y="24" width="52" height="72" rx="8" fill="#ffffff"/>

  <g stroke-linecap="round">
    <line x1="56" y1="42" x2="82" y2="42" stroke="#6D5EF5" stroke-width="6"/>
    <line x1="56" y1="56" x2="88" y2="56" stroke="#C6C8E6" stroke-width="4"/>
    <line x1="56" y1="66" x2="80" y2="66" stroke="#C6C8E6" stroke-width="4"/>
    <line x1="56" y1="76" x2="88" y2="76" stroke="#17B8A6" stroke-width="4"/>
    <line x1="56" y1="86" x2="74" y2="86" stroke="#C6C8E6" stroke-width="4"/>
  </g>
</svg>
